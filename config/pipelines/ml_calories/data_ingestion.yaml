database:
  schema_name: "raw"
  table_name: "calories"
  # Không cần connection string/source nữa vì BasePostgresExtractor đã gọi get_connection() tự động

feature_store:
  file_path: "Artifacts/data/ml_calories/processed/calories_features.csv"
  dvc_tracked: true

target_column:
  name: "Calories"
  type: "float"

data_split:
  train_ratio: 0.8
  test_ratio: 0.1
  validation_ratio: 0.1

output:
  data_version: "v1.0.0"

schema:
  json_schema_file: "config/pipelines/ml_calories/calories_data_schema.json"