# =============================================================================
# EVIDENTLY AI PROFILE CONFIGURATION - ML CALORIES PIPELINE
# =============================================================================

# 1. Định dạng dữ liệu đầu vào (Giữ nguyên)
data_format:
  separator: ","
  header: true
  date_column: null

# 2. Ánh xạ vai trò các cột (Giữ nguyên)
column_mapping:
  target: "Calories"
  prediction: "prediction"
  id: "User_ID"
  numerical_features:
    - "Age"
    - "Height"
    - "Weight"
    - "Duration"
    - "Heart_Rate"
    - "Body_Temp"
  categorical_features:
    - "Gender"

# 3. Kích hoạt phân hệ báo cáo
profile_sections:
  - data_drift

# 4. Cấu hình chi tiết phần phân tích trôi dạt (Chỉ thêm các thông số còn thiếu)
options:
  data_drift:
    # Lựa chọn StatTest do kích thước dữ liệu lớn (10,000 dòng)
    num_stat_test: "wasserstein"      # Đo khoảng cách phân phối cho toàn bộ cột số
    cat_stat_test: "jensenshannon"    # Đo khoảng cách cho cột phân loại (Gender)
    
    # LƯU Ý: Các thông số dưới đây ĐÃ BỎ QUA để kế thừa từ global.yaml:
    # - drift_share (kế thừa dataset_drift_share: 0.5)
    # - threshold (kế thừa psi_warning: 0.10 / p_value_alpha: 0.05)

# 5. Cấu hình lấy mẫu dữ liệu
sampling:
  reference:
    type: "none"
  current:
    type: "none"

pretty_print: true