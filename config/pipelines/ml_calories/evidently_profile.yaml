# =============================================================================
# EVIDENTLY AI PROFILE CONFIGURATION - ML CALORIES PIPELINE
# Đường dẫn: config/pipelines/ml_calories/evidently_profile.yaml
# =============================================================================

# 1. Định dạng dữ liệu đầu vào
data_format:
  separator: ","
  header: true
  date_column: null

# 2. Ánh xạ vai trò các cột (Đặc thù của dataset ml_calories)
column_mapping:
  target: "Calories"
  prediction: "prediction"
  id: "User_ID"
  numerical_features:
    - "Age"
    - "Height"
    - "Weight"
    - "Duration"
    - "Heart_Rate"
    - "Body_Temp"
  categorical_features:
    - "Gender"

# 3. Kích hoạt phân hệ báo cáo
profile_sections:
  - data_drift

# Ghi chú: Phần 'options' (drift_share, confidence, nbinsx) đã được lược bỏ 
# để hệ thống tự động kế thừa từ file global.yaml hoặc dùng mặc định của Evidently AI.

# 4. Cấu hình lấy mẫu dữ liệu
sampling:
  reference:
    type: "none"
  current:
    type: "none"

# 5. Định dạng
pretty_print: true