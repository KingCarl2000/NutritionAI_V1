# =============================================================================
# GLOBAL CORE & MLOPS CONFIGURATIONS
# Cấu hình dùng chung cho toàn bộ các pipelines trong hệ thống
# =============================================================================

core_api_references:
  # 1. Base Schema (base.py)
  base_schema: "src.nutrition_core.pandera.api.base.BaseDataFrameModel"
  validate_df: "src.nutrition_core.pandera.api.base.BaseDataFrameModel.validate_df"

  # 2. Custom Checks (check.py)
  numeric_range_check: "src.nutrition_core.pandera.api.check.is_in_numeric_range"
  string_length_check: "src.nutrition_core.pandera.api.check.is_valid_string_length"

  # 3. Exceptions & Error Handling (val_exception.py)
  data_validation_error: "src.nutrition_core.exception.val_exception.DataValidationError"
  pandera_error_handler: "src.nutrition_core.exception.val_exception.PanderaErrorHandler"
  handle_validation_error: "src.nutrition_core.exception.val_exception.PanderaErrorHandler.handle_validation_error"

  # 4. Decorators & Tracking (logger.py & mlflow_tracker.py)
  validation_handler: "src.nutrition_core.logging.logger.validation_error_handler"
  performance_monitor: "src.nutrition_core.logging.logger.monitor_performance"
  dvc_handler: "src.nutrition_core.logging.logger.dvc_error_handler"
  mlops_tracker: "src.nutrition_core.logging.mlflow_tracker.MLOpsTracker"

# =============================================================================
# MLFLOW TRACKING CONFIGURATIONS
# =============================================================================
mlflow_config:
  tracking_uri: "sqlite:///mlflow.db"
  
  # Cấu hình Tracking Tự động
  autologging:
    enable_hardware_tracking: true  # MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING
    enable_llm_tracing: false       # Bật tắt cho openai/langchain (dựa theo code bị comment)

  # Cấu hình Artifacts & Uploads dùng chung
  artifacts:
    auto_upload_system_logs: true   # Tự động đẩy oper_logs & error_logs khi end_run
    base_reports_dir: "Artifacts/reports" # Thư mục gốc lưu trữ các báo cáo nội bộ
    
  # Ánh xạ thư viện theo Framework (Phục vụ đóng gói log_model)
  requirements_mapping:
    base_file: "base.txt"
    frameworks:
      sklearn: "ml.txt"
      xgboost: "ml.txt"
      pytorch: "dl.txt"
      tensorflow: "dl.txt"
      openai: "llm.txt"
      langchain: "llm.txt"

mlops_thresholds:
  # 1. Ngưỡng Tỷ lệ Vi phạm Dữ liệu (Data Failure Rate)
  data_failure_rate:
    info_threshold: 0.01      # Dưới 1%: Tự động loại bỏ dòng hỏng, tiếp tục chạy
    warning_threshold: 0.05   # Từ 1% - 5%: Ghi log cảnh báo, đưa vào vùng Quarantine
                              # Trên 5%: Ngắt khẩn cấp Pipeline (Fail-Fast)

  # 2. Ngưỡng Trôi lệch Phân phối & Thống kê (Data & Feature Drift)
  data_drift:
    psi_warning: 0.10         
    psi_critical: 0.25        
    p_value_alpha: 0.05       
        
        # --- BỔ SUNG CHO EVIDENTLY ENGINE ---
    dataset_drift_share: 0.5        # Tỷ lệ số cột bị drift để cảnh báo Fail toàn Dataset
    default_method: null            # Thuật toán mặc định chung (để null để Evidently auto-select)
        
        # Cấu hình thuật toán riêng cho từng loại dữ liệu
    numerical:
      method: 'wasserstein'         # VD: wasserstein, ks, psi...
    categorical:
      method: 'chisquare'           # VD: chisquare, z, jensenshannon...
          
      # Cấu hình thuật toán cho Embeddings Drift
    embeddings_drift_method: 'model' # Hỗ trợ: 'model', 'distance', 'ratio', 'mmd'
        
  # 3. Ngưỡng Độ trễ & SLA Kiểm định (Validation SLA & Performance)
  validation_sla:
    online_latency_max_ms: 50           # Tối đa 50ms cho bước validation trên API Serving
    batch_time_max_percentage: 0.10     # Tối đa chiếm 10% tổng thời gian xử lý ETL Batch

  # 4. Ngưỡng Trạng thái Khả dụng (Availability / Health)
  service_availability:
    max_consecutive_failures: 3     # Đợi 3 lần check fail liên tiếp mới báo lỗi (tránh flapping)
    healthcheck_interval_sec: 60    # Tần suất ping kiểm tra sức khỏe

  # 5. Ngưỡng Tỷ lệ Lỗi API (Error Rate)
  api_error_rate:
    http_5xx_warning_ratio: 0.01    # Tỷ lệ lỗi 5xx vượt 1% -> Warning
    http_5xx_critical_ratio: 0.05   # Tỷ lệ lỗi 5xx vượt 5% -> Critical
    min_requests_to_evaluate: 10    # Yêu cầu tối thiểu 10 request để bắt đầu đánh giá tỷ lệ

  # 6. Ngưỡng Độ trễ Dịch vụ (Latency Thresholds)
  service_latency:
    online_p50_max_ms: 50           # Độ trễ trung vị (Median/P50) không quá 50ms
    online_p95_max_ms: 200          # 95% số request (P95) phải được xử lý dưới 200ms
    batch_time_max_percentage: 0.10 # Tối đa chiếm 10% tổng thời gian ETL Batch

  # 7. Ngưỡng Bão hòa & Dự báo Tài nguyên (Saturation & Prediction)
  resource_saturation:
    disk_usage_warning_percent: 0.85 # Cảnh báo khi ổ đĩa thực tế đầy 85%
    ram_usage_warning_percent: 0.85  # Cảnh báo khi RAM thực tế đầy 85%
    prediction_horizon_hours: 4      # Xu hướng tuyến tính: liệu tài nguyên có cạn kiệt trong 4 giờ tới?

  # 8. Ngưỡng Chất lượng Dữ liệu & Dự đoán Mô hình (Data Quality & Model Thresholds)
  data_quality_and_model:
    binary_classification_probas: 0.5 # Ngưỡng xác suất phân loại lớp nhãn tích cực
    almost_constant_columns: 0.95     # Phát hiện cột gần như hằng số (95% giá trị trùng nhau)
    confidence_level: 0.95            # Độ tin cậy thống kê mặc định (Alpha = 0.05)