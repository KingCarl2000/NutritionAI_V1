global:
  scrape_interval: 15s

scrape_configs:
  # ==========================================
  # ROLE 1: POD
  # Dùng để tự động phát hiện các ứng dụng của bạn (API, Inference)
  # ==========================================
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    
    relabel_configs:
      # Chỉ thu thập dữ liệu từ các Pod có khai báo annotation: prometheus.io/scrape: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
        
      # Cập nhật cổng (port) lấy từ annotation: prometheus.io/port
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
        
      # Cập nhật đường dẫn metrics (mặc định là /metrics) từ annotation: prometheus.io/path
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
        
      # Lấy tên ứng dụng từ nhãn (label) của Pod để dễ xem trên Grafana
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: app

  # ==========================================
  # ROLE 2: NODE
  # Dùng để giám sát tình trạng vật lý (CPU, RAM, Disk) của các máy chủ K8s
  # ==========================================
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    
    relabel_configs:
      # Ánh xạ các nhãn (labels) của Node vào metrics
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      # Gán nhãn IP của máy chủ vật lý
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

  # ==========================================
  # ROLE 3: ENDPOINTSLICE (Khuyên dùng thay cho Endpoints)
  # Dùng để giám sát các Service thay vì từng Pod riêng lẻ
  # ==========================================
  - job_name: 'kubernetes-endpointslices'
    kubernetes_sd_configs:
      - role: pod
    
    relabel_configs:
      # Tương tự Pod, chỉ scrape các Service cho phép
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      # Đổi tên namespace thành label để phân loại
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      # Gán tên service
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: service