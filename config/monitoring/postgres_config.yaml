# config/monitoring/postgres_config.yaml

storage:
  type: sql
  database:
    # Chuỗi kết nối đến PostgreSQL. 
    # 'postgres' là tên service trong docker-compose.yml để Docker tự động phân giải IP.
    url: "postgresql://evidently_user:evidently_password@postgres:5432/evidently"

dataset_storage:
  type: fsspec
  # Thư mục lưu trữ các tệp vật lý (như snapshot) của Evidently.
  # Nó sẽ tương ứng với đường dẫn được mount trong Docker Volume (/app/workspace).
  path: "workspace"