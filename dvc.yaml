stages:
  calories_ingest:
    cmd: python src/pipelines/ml_pipelines/calories_pred/data_ingest.py
    deps:
    - src/data_io/base_extractor.py
    - src/data_io/dvc_handler.py
    - src/nutrition_core/logging/logger.py
    - src/nutrition_core/logging/mlflow_tracker.py
    - src/pipelines/ml_pipelines/calories_pred/data_ingest.py
    params:
    - config/datasets/calories.yaml:
    - config/pipelines/ml_calories/data_ingestion.yaml:
    outs:
    - Artifacts/data/ml_calories/raw
    metrics:
    - Artifacts/reports/ml_calories/ingestion/ingestion_report.json:
        cache: false
  calories_validate:
    cmd: python src/pipelines/ml_pipelines/calories_pred/data_val.py
    deps:
    - Artifacts/data/ml_calories/raw/train.csv
    - Artifacts/data/ml_calories/raw/test.csv
    - Artifacts/data/ml_calories/raw/val.csv
    - Artifacts/data/ml_calories/training/train.csv
    - config/pipelines/ml_calories/calories_schema.py
    - src/data_io/dvc_handler.py
    - src/nutrition_core/logging/logger.py
    - src/nutrition_core/logging/mlflow_tracker.py
    - src/nutrition_core/pandera/api/base.py
    - src/nutrition_core/pandera/api/check.py
    - src/nutrition_core/pandera/backends/pandas_executor.py
    - src/nutrition_core/pandera/config.py
    - src/nutrition_core/pandera/decorators.py
    - src/nutrition_core/pandera/evidently_engine.py
    - src/pipelines/ml_pipelines/calories_pred/data_val.py
    - src/pipelines/ml_pipelines/calories_pred/eval_drift.py
    params:
    - config/pipelines/global.yaml:
    - config/pipelines/ml_calories/data_val.yaml:
    - config/pipelines/ml_calories/evidently_profile.yaml:
    outs:
    - Artifacts/data/ml_calories/validated
    metrics:
    - Artifacts/reports/ml_calories/validation/validation_report.json:
        cache: false
  calories_transform:
    cmd: python src/pipelines/ml_pipelines/calories_pred/data_trans.py
    deps:
    - Artifacts/data/ml_calories/validated/test.csv
    - Artifacts/data/ml_calories/validated/train.csv
    - Artifacts/data/ml_calories/validated/val.csv
    - Artifacts/reports/ml_calories/evidently/drift_report.json
    - Artifacts/reports/ml_calories/validation/validation_report.json
    - src/data_io/dvc_handler.py
    - src/nutrition_core/exception/exception.py
    - src/nutrition_core/logging/logger.py
    - src/nutrition_core/logging/mlflow_tracker.py
    - src/pipelines/ml_pipelines/calories_pred/data_trans.py
    - src/pipelines/ml_pipelines/calories_pred/preprocessing.py
    params:
    - config/pipelines/ml_calories/data_transformation.yaml:
    outs:
    - Artifacts/data/ml_calories/transformed
    metrics:
    - Artifacts/reports/ml_calories/transformation/transformation_report.json:
        cache: false
  calories_train:
    cmd: python src/pipelines/ml_pipelines/calories_pred/model_train.py
    deps:
    - Artifacts/data/ml_calories/transformed/preprocessing.pkl
    - Artifacts/data/ml_calories/transformed/train.npy
    - Artifacts/data/ml_calories/transformed/val.npy
    - Artifacts/reports/ml_calories/transformation/transformation_report.json
    - config/pipelines/ml_calories/hydra_config.yaml
    - config/pipelines/ml_calories/train_params.yaml
    - src/nutrition_core/logging/logger.py
    - src/pipelines/ml_pipelines/calories_pred/model_train.py
    - utils/ml_utils/model/model_factory.py
    - utils/ml_utils/model/model_trainer.py
    outs:
    - Artifacts/data/ml_calories/models
    metrics:
    - Artifacts/reports/ml_calories/training/training_report.json:
        cache: false
  calories_package:
    cmd: python src/pipelines/ml_pipelines/calories_pred/model_package.py
    deps:
    - Artifacts/data/ml_calories/models/best_model_mean_squared_error_pipeline.pkl
    - Artifacts/data/ml_calories/models/best_model_r2_score_pipeline.pkl
    - Artifacts/data/ml_calories/models/best_model_root_mean_squared_error_pipeline.pkl
    - Artifacts/reports/ml_calories/training/training_report.json
    - config/pipelines/ml_calories/bentofile.yaml
    - requirements/base.txt
    - requirements/ml.txt
    - service.py
    - src/pipelines/ml_pipelines/calories_pred/model_package.py
    - src/pipelines/ml_pipelines/calories_pred/model_register.py
    outs:
    - Artifacts/data/ml_calories/bentoml
