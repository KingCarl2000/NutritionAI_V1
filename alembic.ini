# A single-database configuration for NutritionAI_V1

[alembic]
# path to migration scripts
script_location = %(here)s/alembic

# template used to generate migration file names;
# Files will be prepended with date and time
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# sqlalchemy.url is intentionally left blank for security.
# The URL is dynamically loaded via src.postgres.core.db_config inside alembic/env.py
sqlalchemy.url = 


# Logging configuration
# Bạn có thể giữ nguyên phần này để Alembic in log ra console khi chạy lệnh.
# Nếu muốn ghi log của Alembic vào file oper_logs, hãy cấu hình lại trong alembic/env.py
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S