      hash: md5
      md5: c7d161e3f392118910b5e7ed71e91320.dir
      size: 1514720
      nfiles: 4
    - path: Artifacts/reports/ml_calories/ingestion/ingestion_report.json
      hash: md5
      md5: 672c20e300622790292c9eb8b4a91f85
      size: 449
