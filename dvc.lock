          transformed_report_path: 
            Artifacts/reports/ml_calories/transformation/transformation_report.json
        column_mapping:
          target: Calories
          id_column: User_ID
          numerical_features:
          - Age
          - Weight
          - Height
          - Duration
          - Heart_Rate
          - Body_Temp
          categorical_features:
          - Gender
        mlflow:
          experiment_name: calories_pred
          run_name: data_transformation
          log_params: true
          log_data_shapes: true
          register_preprocessor: true
        preprocessing:
          numerical:
            imputer:
              type: knn
              n_neighbors: 5
              weights: uniform
              strategy: median
            scaler:
              type: robust
              with_centering: true
              with_scaling: true
              quantile_range:
              - 25.0
              - 75.0
          categorical:
            imputer:
              type: simple
              strategy: most_frequent
            encoder:
              type: onehot
              handle_unknown: ignore
              sparse_output: false
              drop:
