      size: 8121
    params:
      config/datasets/calories.yaml:
        calories:
          db_schema: raw
          table_name: calories
          source_path: D:/NutritionAI_V1/Data/raw/calories.csv
          columns:
            User_ID:
              type: integer
              nullable: false
              description: ''
            Gender:
              type: categorical
              nullable: false
              description: ''
            Age:
              type: integer
              nullable: false
              description: ''
            Height:
              type: float
              nullable: false
              description: ''
            Weight:
              type: float
              nullable: false
              description: ''
            Duration:
              type: float
              nullable: false
              description: ''
            Heart_Rate:
              type: float
              nullable: false
              description: ''
            Body_Temp:
              type: float
              nullable: false
              description: ''
            Calories:
              type: float
              nullable: false
              description: ''
          numerical_columns:
          - User_ID
          - Age
          - Height
          - Weight
          - Duration
          - Heart_Rate
          - Body_Temp
          - Calories
          categorical_columns:
          - Gender
      config/pipelines/ml_calories/data_ingestion.yaml:
        data_split:
          train_ratio: 0.7
          test_ratio: 0.15
          validation_ratio: 0.15
          random_state: 42
        database:
          schema_name: raw
          table_name: calories
        feature_store:
          dvc_tracked: true
          export_dir: Artifacts/data/ml_calories/raw
        schema:
          data_config_file: config/datasets/calories.yaml
          target_column: Calories
          columns_to_drop:
          - User_ID
    outs:
