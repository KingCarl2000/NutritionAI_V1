---
# Khai báo PersistentVolumeClaim để cung cấp ổ đĩa lưu trữ cho TSDB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi # Bạn có thể điều chỉnh dung lượng lưu trữ tại đây
---
# Khai báo Deployment cho Prometheus
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: default # Đã đổi thành default để khớp với cấu trúc dự án
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # Gán ServiceAccount đã cấp quyền RBAC ở bước trước
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: web
          volumeMounts:
            # Mount file cấu hình từ ConfigMap (sử dụng subPath để không ghi đè các file khác trong thư mục)
            - name: config-volume
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            # Mount ổ đĩa lưu trữ cơ sở dữ liệu TSDB
            - name: storage-volume
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage-volume
          persistentVolumeClaim:
            claimName: prometheus-pvc
