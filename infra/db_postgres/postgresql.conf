# ==============================================================================
# NUTRITION AI - CẤU HÌNH TẬP TRUNG DỮ LIỆU (SINGLE SOURCE OF TRUTH)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CẤU HÌNH MẠNG & BẢO MẬT (Thay thế cho vai trò của pg_hba.conf)
# ------------------------------------------------------------------------------
listen_addresses = '*'          # Cho phép kết nối từ mọi IP/Container
port = 5432                     # Cổng mặc định

# ------------------------------------------------------------------------------
# 2. CẤU HÌNH BỘ NHỚ & HIỆU NĂNG (Cho Laptop 32GB RAM & pgvector)
# ------------------------------------------------------------------------------
# Lưu ý: maintenance_work_mem phải nhỏ hơn hoặc bằng shm_size trong docker-compose
maintenance_work_mem = 2GB     # Bộ nhớ ưu tiên dùng để tạo chỉ số HNSW/IVFFlat cho Vector
shared_buffers = 1GB           # Bộ nhớ đệm dữ liệu chia sẻ
work_mem = 64MB                # Bộ nhớ cho mỗi truy vấn xử lý dữ liệu thường

# ------------------------------------------------------------------------------
# 3. TỐI ƯU HÓA TRUY VẤN VECTOR
# ------------------------------------------------------------------------------
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2