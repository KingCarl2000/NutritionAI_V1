services:
  prometheus:
    # Áp dụng Phần 1: Nguồn Image
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    
    volumes:
      # Áp dụng Phần 2: Cung cấp file cấu hình qua Bind-Mount
      # Đã sửa: Lùi 3 cấp thư mục để lấy đúng file từ máy host và đưa vào đúng đích /etc/prometheus/
      - ../../../config/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      
      # Đã sửa: Mount toàn bộ thư mục cấu hình nếu cần đọc rule alert/record (KHÔNG dùng ký tự *)
      - ../../../config/infra/prometheus:/etc/prometheus
      
      # Áp dụng Phần 3: Lưu trữ dữ liệu bền vững qua Named Volume
      - prometheus_data:/prometheus
    
    command:
      # Áp dụng Phần 5: Lưu ý về tham số dòng lệnh
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle' # Cho phép reload cấu hình nóng

# Áp dụng Phần 3: Khai báo Named Volume để dữ liệu không mất khi restart container
volumes:
  prometheus_data:
    driver: local