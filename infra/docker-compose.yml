version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: nutrition_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ../../../.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-nutrition_ai}
      # Docker sẽ tự động lấy POSTGRES_PASSWORD từ file .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Mount script khởi tạo DB & pgvector vào container
      - ./db_postgres/init_vector_db.sql:/docker-entrypoint-initdb.d/01_init_vector_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nutrition_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutrition_net

volumes:
  pg_data:

networks:
  nutrition_net:
    driver: bridge